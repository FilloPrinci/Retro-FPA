[plugin]

name="Item Tools"
description="Adds an \"Oggetti\" bottom-panel dock to scaffold a new pickupable item (ItemData + weapon behavior + translation rows) in one step, and a validator for every resources/items/*.tres — no terminal needed. Pairs with the WorldItem node (core/world_item/world_item.gd) for the object's world presence."
author="Retro FPA"
version="1.0"
script="plugin.gd"
